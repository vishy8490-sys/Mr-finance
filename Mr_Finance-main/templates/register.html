<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Mr Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-icon" style="width:52px;height:52px;font-size:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:14px;margin:0 auto 14px;box-shadow:0 0 32px rgba(99,102,241,0.3)">
        <i class="fas fa-chart-line" style="color:#fff"></i>
      </div>
      <h1>Mr Finance</h1>
      <p>Portfolio Risk Management Platform</p>
    </div>

    <h2 class="auth-title">Create Account</h2>
    <div id="msg-box"></div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control" placeholder="Choose a username"/>
    </div>
    <div class="form-group">
      <label class="form-label">Email (optional)</label>
      <input type="email" id="email" class="form-control" placeholder="your@email.com"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Create password"/>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" id="password2" class="form-control" placeholder="Repeat password"/>
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" onclick="doRegister()">
      <i class="fas fa-user-plus"></i> Create Account
    </button>

    <div class="auth-footer">
      Already have an account? <a href="/login" class="auth-link">Sign In</a>
    </div>
  </div>
</div>

<script>
async function doRegister() {
  const u  = document.getElementById('username').value.trim();
  const p  = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  const e  = document.getElementById('email').value.trim();
  if (!u || !p) { showMsg('Username and password required', 'error'); return; }
  if (p !== p2)  { showMsg('Passwords do not match', 'error'); return; }
  if (p.length < 4) { showMsg('Password must be at least 4 characters', 'error'); return; }
  const res = await fetch('/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p, email: e })
  });
  const data = await res.json();
  if (data.success) {
    showMsg('Account created! Redirecting…', 'success');
    setTimeout(() => window.location = '/login', 1500);
  } else {
    showMsg(data.message || 'Registration failed', 'error');
  }
}
function showMsg(msg, type) {
  const icons = { error: 'exclamation-circle', success: 'check-circle' };
  document.getElementById('msg-box').innerHTML =
    `<div class="alert alert-${type}"><i class="fas fa-${icons[type]}"></i>${msg}</div>`;
}
</script>
</body>
</html>
